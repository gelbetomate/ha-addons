notify:
  name: Show Notification
  description: Shows a temporary notification on the display.
  fields:
    device_id:
      name: Device
      description: The u::lux Display device(s) to show the notification on.
      required: true
      selector:
        device:
          integration: ulux_display
    message:
      name: Message
      description: The notification text. If omitted, the image/icon will be fullscreen.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: Icon to display (e.g. mdi:bell).
      required: false
      selector:
        icon:
    image:
      name: Image Entity
      description: Home Assistant entity to use for the image.
      required: false
      selector:
        entity: {}
    duration:
      name: Duration
      description: How long to show the notification in seconds (default 10).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
    theme:
      name: Theme
      description: Visual theme for the notification (default Classic).
      required: false
      selector:
        select:
          options:
            - classic
            - minimal
            - neon
            - retro
            - soft
            - ocean
            - sunset
            - forest
            - light
            - candy

configure_audio:
  name: Configure audio
  description: Configure the u::lux microphone and speaker audio transport.
  fields:
    device_id:
      name: Device
      description: The u::lux Display device(s) to configure.
      required: true
      selector:
        device:
          integration: ulux_display
    target_ip:
      name: Audio target IP
      description: IPv4 address that receives microphone packets.
      required: true
      selector:
        text:
    target_port:
      name: Audio target port
      description: UDP port for raw audio packets.
      required: false
      default: 35000
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    mic_on:
      name: Microphone active
      required: false
      default: false
      selector:
        boolean:
    mic_gain:
      name: Microphone gain
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    speaker_on:
      name: Speaker active
      required: false
      default: true
      selector:
        boolean:
    speaker_volume:
      name: Speaker volume
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          mode: slider
