notify:
  name: Show Notification
  description: Shows a temporary notification on the display.
  fields:
    device_id:
      name: Device
      description: The u::lux Display device(s) to show the notification on.
      required: true
      selector:
        device:
          integration: ulux_display
    message:
      name: Message
      description: The notification text. If omitted, the image/icon will be fullscreen.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: Icon to display (e.g. mdi:bell).
      required: false
      selector:
        icon:
    image:
      name: Image Entity
      description: Home Assistant entity to use for the image.
      required: false
      selector:
        entity: {}
    duration:
      name: Duration
      description: How long to show the notification in seconds (default 10).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
    theme:
      name: Theme
      description: Visual theme for the notification (default Classic).
      required: false
      selector:
        select:
          options:
            - classic
            - minimal
            - neon
            - retro
            - soft
            - ocean
            - sunset
            - forest
            - light
            - candy

configure_audio:
  name: Configure audio
  description: Configure the u::lux microphone and speaker audio transport.
  fields:
    device_id:
      name: Device
      description: The u::lux Display device(s) to configure.
      required: true
      selector:
        device:
          integration: ulux_display
    target_ip:
      name: Audio target IP
      description: IPv4 address that receives microphone packets.
      required: true
      selector:
        text:
    target_port:
      name: Audio target port
      description: UDP port for raw audio packets.
      required: false
      default: 35000
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    mic_on:
      name: Microphone active
      required: false
      default: false
      selector:
        boolean:
    mic_gain:
      name: Microphone gain
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    speaker_on:
      name: Speaker active
      required: false
      default: true
      selector:
        boolean:
    speaker_volume:
      name: Speaker volume
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          mode: slider

play_sound:
  name: Play local sound
  description: Play a sound stored in the u::lux switch.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    sound_index:
      name: Sound index
      required: true
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    volume:
      name: Volume
      default: 100
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_volume:
  name: Set u::lux volume
  description: Set the master volume on the u::lux switch.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    volume:
      name: Volume
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_page:
  name: Set u::lux page
  description: Select a physical page on the u::lux switch.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    page_index:
      name: Page index
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box

set_active:
  name: Set display active
  description: Wake the display or put it into standby.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    active:
      name: Active
      required: true
      selector:
        boolean:

set_led:
  name: Set u::lux LEDs
  description: Set up to four switch LEDs. Values use color 0-7, blink mode 0-7, and override true.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    actor_id:
      name: Actor ID
      default: 1
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    leds:
      name: LEDs
      description: JSON list, for example [{"color":1,"blinkMode":0,"override":true}].
      required: true
      selector:
        text:

set_text:
  name: Set u::lux text
  description: Set or remove a text overlay on the display.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: ulux_display
    actor_id:
      name: Actor ID
      default: 1
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    text_id:
      name: Text ID
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    text:
      name: Text
      required: false
      selector:
        text:
    visible:
      name: Visible
      default: true
      selector:
        boolean:
    remove:
      name: Remove
      default: false
      selector:
        boolean:
